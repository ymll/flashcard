<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for aesthetic */
        body {
            font-family: 'Inter', sans-serif;
            background-size: 400% 400%;
            animation: gradient-shift 15s ease infinite;
            transition: background 0.5s, background-color 0.5s ease;
        }

        /* --- THEME SPECIFIC BACKGROUNDS --- */

        /* Professional Theme (Default, Light Gradient) */
        .theme-pro {
            background: linear-gradient(135deg, #f0f4ff 0%, #e0f7fa 25%, #fffde7 50%, #fbe9e7 75%, #f3e5f5 100%);
        }
        /* Vibrant Kid Theme (Playful Dots) */
        .theme-kid {
            background-color: #f0fdf4; /* Light Mint Green */
            background-image: radial-gradient(#dcfce7 10%, transparent 10%), radial-gradient(#dcfce7 10%, transparent 10%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }
        /* Dark Theme */
        .theme-dark {
            background-color: #1a1a2e; /* Deep Navy/Indigo */
        }
        /* High Contrast (B&W) Theme */
        .theme-bw {
            background-color: #ffffff;
        }
        /* Rainbow Theme (Vibrant Gradient) */
        .theme-rainbow {
            background: linear-gradient(45deg, #fee2e2, #fbcfe8, #a5b4fc, #bae6fd, #a7f3d0);
            background-size: 400% 400%;
        }


        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .flashcard {
            min-height: 20rem; 
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .flashcard-inner {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            border-radius: 1.5rem;
            /* Ensure text scales within the card */
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .flashcard-back {
            transform: rotateY(180deg);
        }
        .flipped .flashcard-inner {
            transform: rotateY(180deg);
        }
        /* Mobile-friendly adjustments */
        @media (max-width: 640px) {
            .flashcard {
                min-height: 15rem;
            }
        }
    </style>
</head>

        // --- SAFE STORAGE ---
        // localStorage throws in private mode and sandboxed / opaque origins.
        // An unguarded read at startup would kill the whole app before it
        // renders, so every access goes through these helpers: the app
        // always starts, it just doesn't persist without storage.
        function safeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function safeSet(key, value) {
            try { localStorage.setItem(key, value); } catch (e) { /* no storage — keep going without saving */ }
        }

        function countMarks() {
            let knew = 0, missed = 0;
            Object.values(reviewMarks).forEach(v => { if (v === 'knew') knew++; else if (v === 'missed') missed++; });
            return { knew, missed };
        }

        function reviewProgressText() {
            const lang = currentLanguage;
            let text = `${translations[lang]['progress-indicator-card']} ${currentCardIndex + 1} ${translations[lang]['progress-indicator-of']} ${shuffledIndices.length}`;
            const { knew, missed } = countMarks();
            if (knew + missed > 0) text += ` · ✓ ${knew} · ✗ ${missed}`;
            return text;
        }

        /**
         * Helper to update the progress indicator text based on current language and state.
         */
        function updateProgressIndicator() {
            if (currentCardIndex > -1 && currentCardIndex < shuffledIndices.length) {
                progressIndicator.textContent = reviewProgressText();
            } else {
                // Hide if not in review mode
                progressIndicator.classList.add('opacity-0');
            }
        }

        // --- URL SHARING LOGIC (UTF-8 SAFE) ---

        /**
         * Converts a string to Base64 using a UTF-8 safe pipeline.
         */
        function utf8_to_b64(str) {
            const b64 = btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
                function(match, p1) {
                    return String.fromCharCode('0x' + p1);
                })
            );
            // URL-safe base64: '+' and '/' break when a link is pasted into
            // chats that don't percent-encode them, so use '-'/'_' and drop
            // the '=' padding (re-added when decoding).
            return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        /**
         * Decodes a Base64 string back to a UTF-8 string.
         */
        function b64_to_utf8(str) {
            try {
                // Accept new URL-safe links and old plain-base64 links:
                // plain base64 never contains '-' or '_', so converting
                // them back is a no-op for old links.
                let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4) b64 += '=';
                return decodeURIComponent(atob(b64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
            } catch(e) {
                console.error("B64 decoding failed:", e);
                return "";
            }
        }


        /**
         * Converts the current cards array into a Base64-encoded URL-safe string.
         * Encoded as JSON objects, not "term|definition" strings: a term or
         * definition containing "|" would otherwise be split apart on decode.
         */
        function encodeCards(cards) {
            const jsonString = JSON.stringify(cards.map(c => ({ term: c.term, definition: c.definition })));
            return utf8_to_b64(jsonString); 
        }

        /**
         * Decodes a Base64 string from the URL back into a cards array.
         * Accepts the new object shape [{term, definition}] and the legacy
         * pipe-string shape ["term | definition"], plus legacy plain base64
         * (handled by b64_to_utf8), so old shared links keep working.
         */
        function decodeCards(encodedData) {
            try {
                if (!encodedData) return [];
                const jsonString = b64_to_utf8(encodedData);
                if (!jsonString) return [];
                
                const parsed = JSON.parse(jsonString);
                if (!Array.isArray(parsed)) return [];
                
                const decodedCards = [];
                parsed.forEach(entry => {
                    if (entry && typeof entry === 'object' && typeof entry.term === 'string') {
                        // New shape: JSON objects, so "|" in terms and
                        // definitions survives the round trip.
                        if (entry.term.trim()) {
                            decodedCards.push({ term: entry.term.trim(), definition: typeof entry.definition === 'string' ? entry.definition.trim() : '' });
                        }
                    } else if (typeof entry === 'string') {
                        // Legacy shape: "term | definition" strings, split
                        // on the first pipe. (A "|" inside a legacy term was
                        // already lost when that link was shared, so those
                        // links decode exactly as they did before.)
                        const parts = entry.split(/\|(.*)/s).map(p => p.trim());
                        if (parts.length >= 2 && parts[0]) { 
                            decodedCards.push({ term: parts[0], definition: parts[1] || '' });
                        }
                    }
                });
                
                return decodedCards;

            } catch (e) {
                console.error('Failed to decode cards from URL:', e);
                return [];
            }
        }
        
        /**
         * Checks the URL for a shared list and loads it.
         */
        function loadCardsFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('data');
            
            if (encodedData) {
                const decoded = decodeCards(encodedData);
                if (decoded.length > 0) {
                    cards = decoded;
                    
                    // Clean the URL by removing the 'data' parameter to prevent accidental refresh loops
                    const cleanUrl = new URL(window.location.href.split('?')[0]); 
                    window.history.replaceState({}, document.title, cleanUrl.pathname);
                    
                    return true;
                }
            }
            return false;
        }

        /**
         * Generates the complete shareable URL with the current card data encoded.
         */
        function getShareableUrl() {
            const encodedData = encodeCards(cards);
            // Use base URL without existing params before adding 'data'
            const url = new URL(window.location.href.split('?')[0]); 
            url.searchParams.set('data', encodedData);
            return url.href;
        }

        // --- STORAGE AND INITIALIZATION ---

        function loadInitialState() {
            // Load Language - default to English on first visit; a saved
            // choice is always respected afterwards.
            currentLanguage = safeGet(LANG_KEY) || 'en';
            if (currentLanguage !== 'en' && currentLanguage !== 'zh-TW') currentLanguage = 'en';

            const storedTheme = safeGet(THEME_KEY);
            currentTheme = (storedTheme && THEME_CYCLE.includes(storedTheme)) ? storedTheme : 'pro';
            
            applyTheme(currentTheme);

            // Load Cards (URL has highest priority)
            if (!loadCardsFromUrl()) {

                    const storedCards = safeGet(STORAGE_KEY);
                    cards = storedCards ? JSON.parse(storedCards) : DEFAULT_CARDS;
                    if (!Array.isArray(cards) || cards.length === 0) {
                        cards = DEFAULT_CARDS;
                    }
                } catch (error) {
                    console.error('Error loading cards from localStorage, using defaults:', error);
                    cards = DEFAULT_CARDS;
                }
            }
        }
        
        function saveCards() {
            safeSet(STORAGE_KEY, JSON.stringify(cards));
        }

        // --- FONT SIZE LOGIC ---

        function loadFontSize() {

        function applyFontSize() {
            // Ensure font size is within limits
            currentTermFontSize = Math.max(MIN_FONT_SIZE_PX, Math.min(MAX_FONT_SIZE_PX, currentTermFontSize));

            const definitionSize = Math.max(MIN_FONT_SIZE_PX - DEFINITION_OFFSET_PX, currentTermFontSize - DEFINITION_OFFSET_PX);

            flashcardFrontP.style.fontSize = `${currentTermFontSize}px`;

            fontSmallerButton.disabled = currentTermFontSize <= MIN_FONT_SIZE_PX;
            fontLargerButton.disabled = currentTermFontSize >= MAX_FONT_SIZE_PX;
            
            fontSmallerButton.classList.toggle('opacity-50', fontSmallerButton.disabled);
            fontLargerButton.classList.toggle('opacity-50', fontLargerButton.disabled);
        }

        function increaseFontSize() {
            currentTermFontSize += FONT_STEP_PX;
            applyFontSize();
        }

        function decreaseFontSize() {
            currentTermFontSize -= FONT_STEP_PX;
            applyFontSize();
        }

        /**
         * The Fisher-Yates (Knuth) Shuffle algorithm.
         */
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function shuffle(length) {
            return shuffleArray(Array.from({ length }, (_, i) => i));
        }

        // --- GAME LOGIC ---

        /**
         * Resets the UI to the initial launch state (before review starts).
         */
        function resetToLaunchState(fullReset = true) {
            const lang = currentLanguage;
            
            if(fullReset) {
                currentCardIndex = -1; // Critical reset
                isFlipped = false;
            }

            // Always run general UI cleanup
            completionScreen.classList.add('hidden');
            editModal.classList.add('hidden');
            shareModal.classList.add('hidden');
            appContainer.classList.remove('hidden');
            controls.classList.remove('hidden');
            reviewControls.classList.add('hidden');
            progressIndicator.classList.add('opacity-0');
            
            // Only set card content if we are in the launch state ---
            if (currentCardIndex === -1) {
                flashcardWrapper.classList.remove('flipped');
                
                // Set initial card content
                flashcardFrontP.className = 'font-extrabold transition duration-300';
                flashcardFrontP.classList.add(themeConfig[currentTheme].cardFrontText);
                
                flashcardFrontP.innerHTML = `${translations[lang]['card-launch-start']} <br> (${cards.length} ${translations[lang]['card-launch-loaded']})`;
                flashcardBackP.textContent = translations[lang]['modal-instruction']; // Intentional instruction on card back
            }
        }

        function startReview(indices) {
            const lang = currentLanguage;

            if (cards.length === 0) {
                flashcardFrontP.innerHTML = translations[lang]['err-empty-cards'].replace(/\n/g, '<br>');
                flashcardFrontP.classList.remove(themeConfig[currentTheme].cardFrontText);
                flashcardFrontP.classList.add('text-red-500');
                controls.classList.remove('hidden');
                return;
            }

            // Reset state — a fresh round starts with a clean score sheet.
            // `indices` optionally limits the round to a subset (e.g. only
            // the cards marked "didn't know" last round).
            shuffledIndices = indices && indices.length
                ? shuffleArray(indices.slice())
                : shuffle(cards.length);
            reviewMarks = {};
            saveReviewMarks();
            currentCardIndex = 0;
            isFlipped = false;

            // Update UI visibility
            completionScreen.classList.add('hidden');
            appContainer.classList.remove('hidden');
            controls.classList.add('hidden');
            reviewControls.classList.remove('hidden');
            progressIndicator.classList.remove('opacity-0');

            // Show first card
            displayCurrentCard();
        }

        /**
         * Displays the current card based on the shuffled index.
         */
        function displayCurrentCard() {
            const actualIndex = shuffledIndices[currentCardIndex];
            const card = cards[actualIndex];

            // 1. CLEAR CONTENT AND RESET FLIP STATE INSTANTLY (Flicker Fix)
            flashcardBackP.textContent = ''; 
            flashcardWrapper.classList.remove('flipped');
            isFlipped = false;

            // 2. Set front content instantly (using textContent for review cards)
            flashcardFrontP.textContent = card.term;
            
            // 3. Update definition only AFTER the card has fully rotated back to the front face.
            setTimeout(() => {
                 flashcardBackP.textContent = card.definition;
            }, CARD_TRANSITION_TIME_MS); 

            // Update progress
            progressIndicator.textContent = reviewProgressText();
            progressIndicator.classList.remove('text-red-500');
            progressIndicator.classList.add('text-gray-500');
        }

        /**
         * Handles the main click action on the card.
         */
        function handleCardClick() {
            if (currentCardIndex === -1) {
                // If in launch state, click to start review.
                startReview();
                return;
            }

            if (!isFlipped) {
                // 1. Flip the card to show definition
                flashcardWrapper.classList.add('flipped');
                isFlipped = true;
            } else {
                // 2. Advance to the next card
                currentCardIndex++;
                if (currentCardIndex < shuffledIndices.length) {
                    // Show next card
                    displayCurrentCard();
                } else {
                    // Review is complete
                    showCompletionScreen();
                }
            }
        }

        /**
         * Shows the completion message and resets UI state.
         */
        function showCompletionScreen() {
            appContainer.classList.add('hidden');
            reviewControls.classList.add('hidden');
            completionScreen.classList.remove('hidden');
            const { knew } = countMarks();
            completionStats.textContent = translations[currentLanguage]['completion-stats']
                .replace('{knew}', knew)
                .replace('{total}', shuffledIndices.length);
            currentCardIndex = -1; // Indicate game over
        }

        /**
         * Marks the current card as known / not known, then moves on —
         * the same advance as clicking a flipped card.
         */
        function markCurrentCard(result) {
            if (currentCardIndex < 0 || currentCardIndex >= shuffledIndices.length) return;
            reviewMarks[shuffledIndices[currentCardIndex]] = result;
            saveReviewMarks();
            currentCardIndex++;
            if (currentCardIndex < shuffledIndices.length) {
                displayCurrentCard();
            } else {
                showCompletionScreen();
            }
        }

        /**
         * Fallback function to copy text to clipboard using document.execCommand('copy').
         */
        function copyToClipboardFallback(text) {
            const lang = currentLanguage;
            const dummy = document.createElement('textarea');
            dummy.style.position = 'fixed'; 
            dummy.style.opacity = '0';
            dummy.value = text;
            document.body.appendChild(dummy);
            dummy.select();
            try {
                document.execCommand('copy');
                displayMessage(translations[lang]['msg-copy-success'], false);
            } catch (err) {
                displayMessage(translations[lang]['msg-copy-fail'], true);
                console.error("Share URL:", text);
            }
            document.body.removeChild(dummy);
        }
        
        /**
         * Opens the sharing options modal.
         */
        function openShareModal() {
            const lang = currentLanguage;
            const shareUrl = getShareableUrl();
            const message = translations[lang]['share-message'] + shareUrl;

            shareModalTitle.textContent = translations[lang]['share-modal-title'];

            // Define sharing platforms and their configurations.
            // App-scheme links (signal://, sms:) do nothing on a desktop
            // without those apps, so they are only offered on phones/tablets.
            // WhatsApp uses its https share URL, which works everywhere.
            // Touch alone doesn't mean mobile: touchscreen Windows laptops
            // and desktop monitors also have maxTouchPoints > 0. Only
            // desktop-mode iPads (MacIntel + touch) count as mobile via
            // touch; phones/tablets are caught by the user-agent test.
            const isDesktopModeIPad = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
            const isMobileShare = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || isDesktopModeIPad;
            const platforms = [
                // Icon, Name, URL, Tailwind Color classes, mobileOnly?
                { icon: '📱', name: 'WhatsApp', url: `https://wa.me/?text=${encodeURIComponent(message)}`, color: 'bg-green-700 hover:bg-green-800' },
                { icon: '✈️', name: 'Telegram', url: `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(translations[lang]['share-message'].trim())}`, color: 'bg-sky-400 hover:bg-sky-500' },
                { icon: '📘', name: 'Facebook', url: `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}`, color: 'bg-blue-700 hover:bg-blue-800' },
                { icon: '🔒', name: 'Signal', url: `signal://send?text=${encodeURIComponent(message)}`, color: 'bg-blue-600 hover:bg-blue-700', mobileOnly: true },
                { icon: '✉️', name: 'SMS', url: `sms:?body=${encodeURIComponent(message)}`, color: 'bg-gray-700 hover:bg-gray-800', mobileOnly: true }
            ];

            shareOptions.innerHTML = ''; // Clear previous options

            // 1. Add the Copy Link option (always present)
            const copyBtn = document.createElement('button');
            copyBtn.id = 'share-copy-link';
            copyBtn.className = `w-full px-4 py-3 font-semibold rounded-xl transition duration-200 text-white flex items-center justify-center ${themeConfig[currentTheme].primary}`;
            copyBtn.innerHTML = `${translations[lang]['share-copy']} <span class="ml-2">📋</span>`;
            copyBtn.addEventListener('click', () => {
                copyToClipboardFallback(shareUrl);
                closeShareModal();
            });
            shareOptions.appendChild(copyBtn);

            // 2. Add platform sharing links (skip app-only ones on desktop)
            let hiddenMobileOnly = false;
            platforms.forEach(platform => {
                if (platform.mobileOnly && !isMobileShare) { hiddenMobileOnly = true; return; }
                const link = document.createElement('a');
                link.href = platform.url;
                link.target = '_blank'; // Open in a new tab/app
                // Use platform-specific colors
                link.className = `w-full px-4 py-3 font-semibold rounded-xl transition duration-200 text-white flex items-center justify-center ${platform.color}`;
                // Using platform.name for dynamic translation key look-up
                link.innerHTML = `${platform.icon} <span class="ml-2">${translations[lang][`share-${platform.name.toLowerCase()}`]}</span>`;
                shareOptions.appendChild(link);
            });

            // On desktop, explain why Signal/SMS aren't listed.
            shareMobileHint.classList.toggle('hidden', !hiddenMobileOnly);

            shareModal.classList.remove('hidden');
        }

            shareModal.classList.add('hidden');
        }

        /**

        function displayMessage(text, isError = false) {
            progressIndicator.textContent = text;
            progressIndicator.classList.remove('opacity-0', 'text-gray-500', 'text-red-500');

        /**
         * Opens the editing modal and populates the textarea.
         */
        function openEditModal() {
            const textContent = cards.map(c => `${c.term} | ${c.definition}`).join('\n');
            editTextArea.value = textContent;
            editModal.classList.remove('hidden');
        }

        /**
         * Closes the editing modal.
         */
        function closeEditModal() {
            editModal.classList.add('hidden');
        }

        /**
         * Saves the cards from the textarea.
         */
        function handleSaveCards() {
            const rawText = editTextArea.value.trim();
            const lines = rawText.split('\n').filter(line => line.trim() !== '');
            const lang = currentLanguage;

            const newCards = [];
            let errorCount = 0;

            lines.forEach(line => {
                // Split only on the first pipe
                const parts = line.split(/\|(.*)/s).map(p => p.trim());
                if (parts.length >= 2 && parts[0]) { 
                    newCards.push({ term: parts[0], definition: parts[1] || '' });
                } else {
                    errorCount++;
                    console.warn(`Skipping invalid line: "${line}"`);
                }
            });

            if (newCards.length > 0) {
                cards = newCards;
                saveCards();
                // Card order/contents changed, so old per-card marks no
                // longer point at the same cards.
                reviewMarks = {};
                saveReviewMarks();
                closeEditModal();
                
                // Reset to launch state and show confirmation message
                resetToLaunchState(); 
                
                if (errorCount > 0) {
                    displayMessage(`${newCards.length} ${translations[lang]['msg-success-loaded-2']} ${errorCount} ${translations[lang]['msg-invalid-skipped-1']}`, false);
                } else {
                    displayMessage(`${translations[lang]['msg-success-loaded-1']} ${cards.length} ${translations[lang]['msg-success-loaded-2']}`, false);
                }

            } else {
                displayMessage(translations[lang]['err-min-cards'], true);
            }
        }


        // --- DECK EXPORT / IMPORT (JSON file) ---

        function exportDeck() {
            const lang = currentLanguage;
            if (cards.length === 0) {
                displayMessage(translations[lang]['err-empty-cards'], true);
                return;
            }
            const blob = new Blob([JSON.stringify(cards, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'flashcards.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        /**
         * Accepts the two shapes we produce: [{term, definition}] and
         * ["Term | Definition", ...]. Reuses the same line parsing as the
         * editor so pasted and imported cards behave the same.
         */
        function parseImportedCards(parsed) {
            if (!Array.isArray(parsed)) return [];
            const imported = [];
            parsed.forEach(entry => {
                if (typeof entry === 'string') {
                    const parts = entry.split(/\|(.*)/s).map(p => p.trim());
                    if (parts.length >= 2 && parts[0]) imported.push({ term: parts[0], definition: parts[1] || '' });
                } else if (entry && typeof entry.term === 'string' && entry.term.trim()) {
                    imported.push({ term: entry.term.trim(), definition: typeof entry.definition === 'string' ? entry.definition.trim() : '' });
                }
            });
            return imported;
        }

        function importDeckFile(file) {
            const lang = currentLanguage;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const imported = parseImportedCards(JSON.parse(reader.result));
                    if (imported.length === 0) throw new Error('No valid cards in file');
                    cards = imported;
                    saveCards();
                    reviewMarks = {};
                    saveReviewMarks();
                    closeEditModal();
                    resetToLaunchState();
                    displayMessage(
                        translations[lang]['msg-import-success'].replace('{count}', imported.length),
                        false
                    );
                } catch (e) {
                    console.error('Failed to import deck:', e);
                    displayMessage(translations[lang]['msg-import-fail'], true);
                }
            };
            reader.readAsText(file);
        }


        // --- EVENT LISTENERS ---

        // Home button returns to launch state
        homeButton.addEventListener('click', () => resetToLaunchState(true));

        // Language and Theme Toggles
        languageToggleButton.addEventListener('click', toggleLanguage);
        themeToggleButton.addEventListener('click', toggleTheme);

        // Font size controls
        fontSmallerButton.addEventListener('click', decreaseFontSize);
        fontLargerButton.addEventListener('click', increaseFontSize);

        // Start/Try Again buttons
        startButton.addEventListener('click', () => startReview());
        // Try Again re-reviews just the cards marked "didn't know";
        // with nothing missed (or nothing marked) it reviews the full deck.
        tryAgainButton.addEventListener('click', () => {
            const missed = Object.keys(reviewMarks)
                .filter(k => reviewMarks[k] === 'missed')
                .map(Number);
            startReview(missed.length ? missed : null);
        });

        // Start Over restarts the whole deck from the beginning.
        startOverButton.addEventListener('click', () => startReview());

        // Edit Cards button (main page)
        editButton.addEventListener('click', openEditModal);

        // Knew / didn't-know buttons (shown only while reviewing)
        knewButton.addEventListener('click', () => markCurrentCard('knew'));
        missedButton.addEventListener('click', () => markCurrentCard('missed'));

        // Deck export / import (in the edit modal)
        exportButton.addEventListener('click', exportDeck);
        importButton.addEventListener('click', () => importFileInput.click());
        importFileInput.addEventListener('change', () => {
            if (importFileInput.files.length) importDeckFile(importFileInput.files[0]);
            importFileInput.value = ''; // allow choosing the same file again
        });

        // Share Button (Now opens the modal)
        shareButton.addEventListener('click', handleShare);
        closeShareModalButton.addEventListener('click', closeShareModal);


        // Card navigation (Click anywhere on the card container)
        flashcardWrapper.addEventListener('click', handleCardClick);

        // Edit Modal controls
        cancelButton.addEventListener('click', closeEditModal);
        saveButton.addEventListener('click', handleSaveCards);

        // Keyboard: Space / Enter / ArrowRight flip or advance, ArrowLeft
        // goes back, Esc closes a modal. Ignored while typing, and
        // Space/Enter are left alone when a button has focus (they
        // activate the button natively).
        document.addEventListener('keydown', (e) => {
            const target = e.target;
            const typing = target && (target.tagName === 'TEXTAREA' || target.tagName === 'INPUT' || target.tagName === 'SELECT' || target.isContentEditable);
            if (typing) return;
            const modalOpen = !editModal.classList.contains('hidden') || !shareModal.classList.contains('hidden');
            if (e.key === 'Escape') {
                if (modalOpen) { closeEditModal(); closeShareModal(); }
                return;
            }
            if (modalOpen) return;
            const onButton = target && (target.tagName === 'BUTTON' || target.tagName === 'A');
            if (onButton && (e.key === ' ' || e.key === 'Enter')) return; // let the button handle it
            if (currentCardIndex === -1) {
                if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') {
                    e.preventDefault();
                    startReview();
                }
                return;
            }
            if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                handleCardClick();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (isFlipped) {
                    flashcardWrapper.classList.remove('flipped');
                    isFlipped = false;
                } else if (currentCardIndex > 0) {
                    currentCardIndex--;
                    displayCurrentCard();
                }
            }
        });


        // --- INITIAL SETUP ---
        document.addEventListener('DOMContentLoaded', () => {
            loadInitialState();
            loadReviewMarks();
            loadFontSize(); // Load and apply font size preference
            resetToLaunchState(); // Ensure the app starts in the correct state
        });

    </script>
</body>
</html>
